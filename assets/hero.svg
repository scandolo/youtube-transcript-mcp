<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Transcript MCP</title>
  <desc id="desc">A YouTube video becomes a searchable transcript with timestamped citations for AI assistants.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101324"/><stop offset="1" stop-color="#1c2038"/></linearGradient>
    <linearGradient id="red" x2="1"><stop stop-color="#fb4a58"/><stop offset="1" stop-color="#ff7764"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#070914" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1065" cy="42" r="206" fill="#fb4a58" opacity=".035"/>
  <circle cx="110" cy="420" r="250" fill="#8b8dfb" opacity=".05"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <rect x="45" y="36" width="176" height="31" rx="15.5" fill="#292d46"/>
    <circle cx="62" cy="51" r="5" fill="#ff625f"/><text x="75" y="56" font-size="13" font-weight="700" fill="#d6d9f0" letter-spacing="1.2">OPEN SOURCE MCP</text>
    <text x="45" y="123" font-size="42" font-weight="800" fill="#fff">Let your AI read YouTube.</text>
    <text x="45" y="177" font-size="42" font-weight="800" fill="#fff">Get answers <tspan fill="#ff6b67">with receipts.</tspan></text>
    <text x="47" y="215" font-size="18" fill="#b5bbd8">Search, read and cite videos inside Claude, ChatGPT and other MCP clients.</text>
    <g filter="url(#shadow)">
      <rect x="47" y="266" width="314" height="111" rx="14" fill="#252a41" stroke="#454a68"/>
      <rect x="65" y="285" width="63" height="43" rx="11" fill="url(#red)"/>
      <path d="M91 294v25l20-12.5z" fill="white"/>
      <text x="145" y="305" font-size="15" font-weight="700" fill="#fff">YouTube video</text>
      <text x="145" y="325" font-size="12" fill="#aeb6d5">Paste any video URL</text>
      <text x="66" y="353" font-size="12" fill="#c9cce1" font-family="SFMono-Regular,Consolas,monospace">youtube.com/watch?v=…</text>
      <rect x="443" y="252" width="332" height="139" rx="14" fill="#252a41" stroke="#454a68"/>
      <text x="464" y="283" font-size="13" font-weight="700" fill="#ffbdb7" letter-spacing="1">SEARCHABLE TRANSCRIPT</text>
      <text x="464" y="313" font-size="13" fill="#fff">00:42   The key idea is…</text>
      <text x="464" y="339" font-size="13" fill="#fff">04:18   Here's how it works…</text>
      <text x="464" y="365" font-size="13" fill="#fff">09:07   The result is…</text>
      <rect x="855" y="266" width="297" height="111" rx="14" fill="#252a41" stroke="#454a68"/>
      <text x="877" y="298" font-size="13" font-weight="700" fill="#c7c8ff" letter-spacing="1">YOUR AI ASSISTANT</text>
      <text x="877" y="325" font-size="13" fill="#fff">Answers with deep links</text>
      <text x="877" y="351" font-size="13" fill="#9da7ff" text-decoration="underline">Watch the exact moment ↗</text>
    </g>
    <path d="M370 321h62m-12-11 12 11-12 11M784 321h62m-12-11 12 11-12 11" stroke="#888efb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
