<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">From video to cited answer</title>
  <desc id="desc">A YouTube video flows into a timestamped transcript, then into an answer linked to the source.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c1020"/>
      <stop offset="1" stop-color="#171b2b"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6d2635"/>
      <stop offset=".55" stop-color="#d43c4c"/>
      <stop offset="1" stop-color="#ff8168"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fa6869"/>
      <stop offset="1" stop-color="#9897fa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="26"/></clipPath>
    <clipPath id="videoFrame"><rect x="53" y="232" width="254" height="146" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <circle cx="1130" cy="365" r="145" fill="#7778f5" opacity=".13" filter="url(#glow)"/>
    <circle cx="64" cy="350" r="126" fill="#f25866" opacity=".09" filter="url(#glow)"/>
    <path d="M0 205H1200M0 407H1200" stroke="#fff" stroke-opacity=".055"/>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
      <circle cx="57" cy="54" r="6" fill="#fc6669"/>
      <text x="74" y="59" fill="#b8bfd8" font-size="13" font-weight="700" letter-spacing="2">OPEN SOURCE MCP</text>
      <text x="53" y="145" fill="#f8f9ff" font-size="53" font-weight="750" letter-spacing="-1.8">From video to <tspan fill="#aaa9ff">cited answer.</tspan></text>

      <text x="54" y="218" fill="#fb7773" font-size="12" font-weight="700" letter-spacing="2">01  VIDEO</text>
      <text x="424" y="218" fill="#aaa9ff" font-size="12" font-weight="700" letter-spacing="2">02  TRANSCRIPT</text>
      <text x="854" y="218" fill="#aaa9ff" font-size="12" font-weight="700" letter-spacing="2">03  ANSWER</text>

      <!-- Video: an actual thumbnail shape rather than a text-heavy card. -->
      <rect x="53" y="232" width="254" height="146" rx="16" fill="url(#video)"/>
      <g clip-path="url(#videoFrame)">
        <circle cx="269" cy="203" r="145" fill="#ffab7f" opacity=".22"/>
        <path d="M38 349c58-66 111-85 167-54 42 23 70 15 117-11v107H38z" fill="#5f273f" opacity=".48"/>
        <path d="M51 340c78-46 132-29 187 1 25 14 53 14 81 6" fill="none" stroke="#ffbc9d" stroke-opacity=".32" stroke-width="2"/>
        <rect x="53" y="356" width="254" height="22" fill="#171724" opacity=".55"/>
        <path d="M66 367h147" stroke="#f9f7ff" stroke-opacity=".52" stroke-width="3" stroke-linecap="round"/>
        <path d="M66 367h59" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="125" cy="367" r="4" fill="#fff"/>
      </g>
      <circle cx="180" cy="301" r="29" fill="#fff" fill-opacity=".94"/>
      <path d="M173 285v32l25-16z" fill="#d74755"/>
      <rect x="251" y="245" width="42" height="20" rx="6" fill="#171724" opacity=".67"/>
      <text x="258" y="259" fill="#fff" font-size="11" font-weight="650">24:18</text>

      <!-- Transcript: one highlighted timestamp does the explanatory work. -->
      <rect x="423" y="232" width="334" height="146" rx="16" fill="#20263a" stroke="#3b435e"/>
      <path d="M446 258h158" stroke="#8490b2" stroke-opacity=".47" stroke-width="7" stroke-linecap="round"/>
      <rect x="438" y="281" width="304" height="34" rx="8" fill="#7778df" fill-opacity=".19" stroke="#9d9af9" stroke-opacity=".51"/>
      <text x="451" y="303" fill="#c6c4ff" font-size="13" font-weight="700" font-family="SFMono-Regular,Consolas,monospace">03:18</text>
      <path d="M512 297h146m-146 8h107" stroke="#dadcff" stroke-opacity=".8" stroke-width="5" stroke-linecap="round"/>
      <text x="451" y="344" fill="#9da7c6" font-size="13" font-weight="600" font-family="SFMono-Regular,Consolas,monospace">07:42</text>
      <path d="M512 338h198m-198 8h151" stroke="#8994b1" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"/>

      <!-- The citation is visually tied to the answer. -->
      <rect x="853" y="232" width="294" height="146" rx="16" fill="#20263a" stroke="#3b435e"/>
      <circle cx="881" cy="262" r="13" fill="#8585ef"/>
      <path d="M875 264l5 5 8-12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M906 257h153m-153 11h120M878 295h224m-224 12h169" stroke="#c2c8df" stroke-opacity=".67" stroke-width="6" stroke-linecap="round"/>
      <rect x="876" y="329" width="114" height="33" rx="9" fill="#8585ef" fill-opacity=".18" stroke="#9897fa" stroke-opacity=".55"/>
      <path d="M894 347h10m-5-5v10" stroke="#bbbaff" stroke-width="1.8" stroke-linecap="round"/>
      <text x="913" y="351" fill="#cecdff" font-size="13" font-weight="700" font-family="SFMono-Regular,Consolas,monospace">03:18 ↗</text>

      <!-- Fine connectors keep the flow clear without more copy. -->
      <path d="M327 305h76m-11-10 11 10-11 10M778 305h55m-11-10 11 10-11 10" fill="none" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="326" cy="305" r="3" fill="#fa6869"/>
      <circle cx="778" cy="305" r="3" fill="#9897fa"/>
    </g>
  </g>
</svg>
