[project]
name = "youtube-transcript-mcp"
version = "0.1.0"
description = "MCP server that turns YouTube videos into searchable, timestamped transcripts"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastmcp>=2.11",
    "yt-dlp>=2026.7.4",
    "youtube-transcript-api>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
youtube-transcript-mcp = "youtube_transcript_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["youtube_transcript_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
